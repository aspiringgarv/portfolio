server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: portfolio
  datasource:
    url: jdbc:h2:file:./data/portfolio;AUTO_SERVER=FALSE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      enabled: false
portfolio:
  admin-token: ${PORTFOLIO_ADMIN_TOKEN:}
  allowed-origins: ${PORTFOLIO_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
